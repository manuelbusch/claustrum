[workspace]
resolver = "3"
members = [
    "crates/claustrum-sandbox",
    "crates/claustrum-mcp",
    "crates/claustrum-cli",
    "crates/claustrum-confine",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/manuelbusch/claustrum"

[workspace.dependencies]
claustrum-sandbox = { path = "crates/claustrum-sandbox" }
claustrum-mcp = { path = "crates/claustrum-mcp" }
claustrum-confine = { path = "crates/claustrum-confine" }

# Wasmer / WASIX. All pinned to the same release; Wasmer pins internally with `=`.
wasmer = { version = "=7.4.2", default-features = false, features = ["sys", "cranelift", "wat"] }
wasmer-wasix = { version = "=0.704.2", default-features = false, features = ["sys-default"] }
virtual-fs = { version = "=0.704.2", default-features = false, features = ["host-fs"] }
virtual-net = { version = "=0.704.2", default-features = false }
webc = { version = "12", default-features = false, features = ["v3"] }
wasmer-package = { version = "=0.704.2", default-features = false }
wasmer-wasix-types = "=0.704.2"
wasmer-config = "=0.704.2"
wasmer-types = { version = "=7.4.2", default-features = false }

# MCP
rmcp = { version = "3", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1"

# Async / serde
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "fs", "sync", "time", "process", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"

# Native tools
globset = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
grep-matcher = "0.1"
similar = "2"

# Infra
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
toml = "0.9"
tempfile = "3"
which = "8"
regex = "1"
libc = "0.2"
sha2 = "0.11"
async-trait = "0.1"
httparse = "1"
ipnet = "2"
base64 = "0.22"
getrandom = "0.3"
bytes = "1"
semver = "1"
http = "1"
url = "2"

[profile.release]
lto = "thin"
codegen-units = 4
