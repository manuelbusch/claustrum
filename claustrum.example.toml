# Example Claustrum configuration.
#
# Copy to `claustrum.toml` in your project (or to
# ~/Library/Application Support/de.buschmanuel.claustrum/config.toml on macOS,
# ~/.config/claustrum/config.toml on Linux). Every setting is optional.
#
# A project's claustrum.toml is only used after you trusted its content
# (`claustrum trust`, or the prompt of `claustrum run`); every change asks
# again. Files passed with --config and the user configuration need no trust.

[sandbox]
# Host directory mounted read/write at /workspace. Defaults to the current directory.
# workspace = "."

# Network access is configured in [network] below. `network = "disabled"`
# or `network = "host"` here is accepted as a shorthand for its mode.

# Default per-command timeout in seconds (0 = unlimited).
timeout_secs = 120

# Bytes retained per output stream of a command.
max_output_bytes = 1048576

# Guest processes and threads per command, counted together (default 64).
# max_threads = 64

# Memory one guest process may grow to, in MiB (default 1024; 0 allows
# wasm32's 4 GiB). Bash calls always end after at most 10 minutes, also
# with timeout_secs = 0.
# max_memory_mb = 1024

# OS sandbox around the Wasmer worker and the host actions, the second layer
# behind WASIX: "best-effort" (default; confine where supported, warn where
# not), "required" (refuse to start without it) or "off" (single process,
# host actions run with your full rights). macOS (Seatbelt) and Linux
# (bubblewrap + Landlock + seccomp) for now.
# confinement = "best-effort"

# Host paths confined processes may never read, in addition to the built-in
# credential stores (~/.ssh, ~/.aws, ~/.gnupg, keychains, browser profiles...).
# deny_read = ["~/private"]

# Extra environment variables for guest commands.
[sandbox.env]
# RUST_LOG = "info"

# Network access for the guest and for host actions. Every connection passes
# one gate; refusals are logged and reported in the tool result.
[network]
# "disabled" (default): nothing is reachable.
# "allowlist": only the destinations below.
# "audit": everything is reachable, and what the allowlist would refuse is
#          logged; run `claustrum network report` afterwards to build it.
# "host": unrestricted.
mode = "disabled"

# Destinations as host[:ports]. Port defaults to 443; ports may be "80,443",
# "8000-8100" or "*". "*.example.com" matches subdomains only. Loopback and
# private addresses are only reachable through an explicit IP or CIDR entry,
# even if an allowed name resolves to them.
# allow = [
#   "crates.io",
#   "*.crates.io",
#   "github.com:443",
#   "pypi.org:80,443",
#   "127.0.0.1:5432",
# ]

# Every decision is appended here as JSON lines. Defaults to a per-workspace
# file in the user state directory.
# log = "~/.local/state/claustrum/network.jsonl"

[packages]
# Directory holding the .webc files. Defaults to the user data directory.
# dir = "~/.local/share/claustrum/packages"

# Allow the runtime to fetch missing packages from the Wasmer registry.
online = false

# Packages loaded into the sandbox. When this list is empty, bash, coreutils,
# python and jq are used. `source` is what `claustrum pkg sync` downloads;
# pin it with `@=<version>` (a bare `@<version>` also accepts newer releases);
# `id` is only needed for files obtained elsewhere that other packages depend
# on. `file` may also name a directory package created by `pkg add-wasm`.
[[packages.package]]
file = "bash.webc"
source = "wasmer/bash@=1.0.25"

[[packages.package]]
file = "coreutils.webc"
source = "wasmer/coreutils@=1.0.25"

[[packages.package]]
file = "python.webc"
source = "python/python@=3.13.20"

[[packages.package]]
file = "jq.webc"
source = "syrusakbary/jq@=0.1.0"

# A self-built WASIX binary, e.g. from scripts/build-jaq.sh:
# [[packages.package]]
# file = "jaq"

# Additional host directories, mounted at absolute guest paths. They are
# read-only unless `writable = true` is set.
# [[mounts]]
# guest = "/data"
# host = "~/datasets"
#
# [[mounts]]
# guest = "/out"
# host = "~/results"
# writable = true

# Host actions: fixed commands on the host that Claude may trigger from the
# sandbox, with inputs validated against the declaration. This file is
# read-only inside the sandbox, so Claude cannot add or change actions.
#
# CAUTION: every action is a deliberate hole in the sandbox. The command runs
# as your user; with OS confinement (see [sandbox] confinement) it can only
# write the workspace, its $TMPDIR and `writable`, cannot read credential
# stores and reaches the network only through the proxy. The validation only
# guards the inputs you declare. Programs that execute configuration or
# scripts from the workspace (cargo, git, npm, make, shells, ...) run code
# Claude can write, even without inputs. Declare no inputs when you can, keep
# patterns as narrow as possible, never put a placeholder where a shell or
# interpreter would re-parse it, and only declare commands you would let
# Claude run on the host directly. See README, "Host actions".
[actions]
# Guest command that triggers the actions (`host test` in Bash). Must not
# collide with a package command.
# command = "host"

# [[actions.action]]
# name = "test"                                  # [a-z][a-z0-9-]{0,31}
# description = "Run the whole Rust test suite"  # shown to Claude
# command = ["cargo", "test", "--workspace"]     # argv; no shell involved
# cwd = "crates/claustrum-cli"                   # relative to the workspace
# timeout_secs = 600                             # default: [sandbox].timeout_secs
# max_output_bytes = 1048576                     # default: [sandbox].max_output_bytes
# env = { CARGO_TERM_COLOR = "never" }           # only PATH, HOME, LANG are inherited
# env_passthrough = ["CARGO_HOME"]               # host variables forwarded by name
# writable = ["~/.cargo/registry"]               # extra writable dirs (confined only)
# confine = "os"                                 # default; "none" runs unconfined

# [[actions.action]]
# name = "test-crate"
# description = "Run the tests of one crate, optionally filtered by test name"
# command = ["cargo", "test", "-p", "{crate}", "--", "{filter}"]
#
# [[actions.action.input]]
# name = "crate"
# pattern = "[a-z][a-z0-9-]{0,40}"               # whole value must match
#
# [[actions.action.input]]
# name = "filter"
# pattern = "[A-Za-z0-9_:]{0,80}"
# default = ""                                   # makes the input optional

# [[actions.action]]
# name = "fmt-file"
# description = "Format one file with rustfmt"
# command = ["rustfmt", "--edition", "2024", "{file}"]
#
# [[actions.action.input]]
# name = "file"
# kind = "path"                                  # must resolve inside the workspace
# must_exist = true

# Other input kinds: `choices = ["debug", "release"]` and
# `kind = "integer"` with `min` / `max`. Every value is limited to `max_len`
# bytes (default 256), may not contain control characters and may not start
# with `-` unless `allow_leading_dash = true`.

[claude]
# Path to the claude binary. Defaults to `claude` on PATH.
# binary = "/usr/local/bin/claude"

# Built-in Claude Code tools to keep. Empty removes all of them except
# AskUserQuestion, which only prompts the user; WebSearch is safe to keep
# because it runs on the API side. Agent enables subagents and Workflow
# (together with Agent) multi-agent workflows; their agents only get the
# Claustrum tools (see "Subagents" in the README).
tools = []

# Extra arguments always passed to claude. Flags that would override the
# sandbox set up by `claustrum run` (--tools, --mcp-config, --settings,
# --permission-mode, --dangerously-skip-permissions, ...) are refused.
args = []

# Text appended to the system prompt in addition to the sandbox notice.
# system_prompt = "Always run the test suite before finishing."

# Plan mode: keep EnterPlanMode/ExitPlanMode and add the WritePlan/EditPlan
# tools, which write only this workspace's plan files in ~/.claude/plans
# (through the broker; the directory is not mounted in the sandbox).
plans = true
